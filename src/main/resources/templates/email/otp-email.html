<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <style>
        .container {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            border-radius: 10px;
            padding: 20px;
            max-width: 500px;
            margin: auto;
        }
        .otp-box {
            font-size: 28px;
            font-weight: bold;
            color: #2d89ef;
            background: #e6f0ff;
            padding: 10px 20px;
            border-radius: 8px;
            text-align: center;
            margin: 20px 0;
            letter-spacing: 3px;
        }
        .footer {
            font-size: 12px;
            color: #888;
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>
<body>
<div class="container">

    <h2>Xác thực tài khoản của bạn</h2>
    <p>Xin chào <span th:text="${username}"></span>,</p>
    <p>Đây là mã OTP của bạn, vui lòng không chia sẻ cho ai khác:</p>

    <div class="otp-box" th:text="${otp}"></div>

    <p>Mã này sẽ hết hạn sau <b th:text="${expiryMinutes}"></b> phút.</p>

    <p>Cảm ơn bạn đã sử dụng dịch vụ của chúng tôi!</p>

    <div class="footer">
        &copy; 2025 Place Review App
    </div>
</div>
</body>
</html>
